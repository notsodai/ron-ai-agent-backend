spring:
  application:
    name:
      ron-ai-agent
  profiles:
    active: dev
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gpt-oss:20b
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json

server:
  port: 8081
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ron.ronaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

app:
  admin:
    token: ${APP_ADMIN_TOKEN:change-me-in-prod}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
