spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
  search-api:
    api-key: ${SEARCH_API_KEY:test-search-api-key}

app:
  admin:
    token: test-admin-token
  cors:
    allowed-origins: "*"
